name: Deploy CHITS Modern frontend to GitHub Pages
on:
  push:
    branches: [feat/github-pages-php-backend-deployment]
    paths:
      - "pilot/public/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static frontend
        env:
          CHITS_API_BASE_URL: ${{ vars.CHITS_API_BASE_URL }}
        run: |
          mkdir -p _site
          cp pilot/public/index.html pilot/public/app.js pilot/public/styles.css _site/
          node -e 'const fs=require("fs"); const u=(process.env.CHITS_API_BASE_URL||"").trim().replace(/\/$/,""); if(u && !/^https:\/\//i.test(u)) throw new Error("CHITS_API_BASE_URL must use HTTPS"); fs.writeFileSync("_site/config.js", "window.CHITS_CONFIG = "+JSON.stringify({apiBaseUrl:u})+";\n");'
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
